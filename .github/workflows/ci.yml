# Kiểm tra dự án biên dịch và đóng gói được mỗi khi push hoặc mở Pull Request vào main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build (biên dịch + đóng gói WAR)
        run: mvn -B -DskipTests package
